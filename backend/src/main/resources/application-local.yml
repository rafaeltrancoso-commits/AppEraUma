spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/erauma}
    username: ${SPRING_DATASOURCE_USERNAME:erauma}
    password: ${SPRING_DATASOURCE_PASSWORD:}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.0.6:8081}
  auth:
    password-reset:
      expose-token: ${APP_PASSWORD_RESET_EXPOSE_TOKEN:true}
